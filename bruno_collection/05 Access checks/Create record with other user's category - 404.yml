info:
  name: Create record with other user's category - 404
  type: http
  seq: 3
http:
  method: POST
  url: '{{expenseBaseUrl}}/record'
  body:
    type: json
    data: |-
      {
        "category_id": {{otherCategoryId}},
        "amount": 10
      }
  auth:
    type: bearer
    token: '{{userToken}}'
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '404'
