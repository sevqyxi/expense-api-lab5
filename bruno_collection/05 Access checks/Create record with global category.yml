info:
  name: Create record with global category
  type: http
  seq: 1
http:
  method: POST
  url: '{{expenseBaseUrl}}/record'
  body:
    type: json
    data: |-
      {
        "category_id": {{globalCategoryId}},
        "amount": 45
      }
  auth:
    type: bearer
    token: '{{userToken}}'
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '201'
