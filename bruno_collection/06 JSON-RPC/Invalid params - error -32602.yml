  url: '{{expenseBaseUrl}}/rpc'
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "method": "create_record",
        "params": {"category_id": {{globalCategoryId}}, "amount": -5},
        "id": 8
      }
  auth:
    type: bearer
    token: '{{userToken}}'
runtime:
