info:
  name: Single request create_record
  type: http
  seq: 1
http:
  method: POST
  url: '{{expenseBaseUrl}}/rpc'
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "method": "create_record",
        "params": {
          "category_id": {{personalCategoryId}},
          "amount": 250.5
        },
        "id": 1
      }
  auth:
    type: bearer
    token: '{{userToken}}'
runtime:
  scripts:
  - type: after-response
    code: |-
      bru.setVar("rpcRecordId", res.body.result.record_id);
  - type: tests
    code: |-
      test("single response with result and same id", function () {
        expect(res.body.jsonrpc).to.equal("2.0");
        expect(res.body.id).to.equal(1);
        expect(res.body.result.status).to.equal("created");
      });
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
