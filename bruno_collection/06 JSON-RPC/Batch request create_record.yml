info:
  name: Batch request create_record
  type: http
  seq: 2
http:
  method: POST
  url: '{{expenseBaseUrl}}/rpc'
  body:
    type: json
    data: |-
      [
        {"jsonrpc": "2.0", "method": "create_record", "params": {"category_id": {{globalCategoryId}}, "amount": 100.0}, "id": 1},
        {"jsonrpc": "2.0", "method": "create_record", "params": {"category_id": {{globalCategoryId}}, "amount": 45.5}, "id": 2}
      ]
  auth:
    type: bearer
    token: '{{userToken}}'
runtime:
  scripts:
  - type: tests
    code: |-
      test("batch returns two results in order", function () {
        expect(res.body).to.be.an("array").with.lengthOf(2);
        expect(res.body[0].id).to.equal(1);
        expect(res.body[1].id).to.equal(2);
        expect(res.body[0].result.status).to.equal("created");
        expect(res.body[1].result.status).to.equal("created");
      });
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
