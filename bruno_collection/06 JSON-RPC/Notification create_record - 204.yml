info:
  name: Notification create_record - 204
  type: http
  seq: 3
http:
  method: POST
  url: '{{expenseBaseUrl}}/rpc'
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "method": "create_record",
        "params": {
          "category_id": {{globalCategoryId}},
          "amount": 5
        }
      }
  auth:
    type: bearer
    token: '{{userToken}}'
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '204'
