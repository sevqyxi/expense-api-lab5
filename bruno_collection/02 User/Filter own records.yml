info:
  name: Filter own records
  type: http
  seq: 10
http:
  method: GET
  url: '{{expenseBaseUrl}}/record?user_id={{userId}}'
  params:
  - name: user_id
    value: '{{userId}}'
    type: query
  auth:
    type: bearer
    token: '{{userToken}}'
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
