info:
  name: Change role - 403
  type: http
  seq: 9
http:
  method: PATCH
  url: '{{userBaseUrl}}/user/{{userId}}/role'
  body:
    type: json
    data: |-
      {
        "role": "admin"
      }
  auth:
    type: bearer
    token: '{{auditorToken}}'
runtime:
  assertions:
  - expression: res.status
    operator: eq
    value: '403'
