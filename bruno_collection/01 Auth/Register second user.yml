info:
  name: Register second user
  type: http
  seq: 2
http:
  method: POST
  url: '{{userBaseUrl}}/register'
  body:
    type: json
    data: |-
      {
        "username": "user2_{{runId}}",
        "password": "Secret12345",
        "name": "Olena Kovalenko"
      }
  auth: inherit
runtime:
  scripts:
  - type: after-response
    code: |-
      bru.setVar("otherUserId", res.body.id);
  assertions:
  - expression: res.status
    operator: eq
    value: '201'
