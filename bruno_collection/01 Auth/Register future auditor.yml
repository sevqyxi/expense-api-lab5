info:
  name: Register future auditor
  type: http
  seq: 3
http:
  method: POST
  url: '{{userBaseUrl}}/register'
  body:
    type: json
    data: |-
      {
        "username": "auditor_{{runId}}",
        "password": "Secret12345"
      }
  auth: inherit
runtime:
  scripts:
  - type: after-response
    code: |-
      bru.setVar("auditorId", res.body.id);
  assertions:
  - expression: res.status
    operator: eq
    value: '201'
