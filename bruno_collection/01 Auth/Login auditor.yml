info:
  name: Login auditor
  type: http
  seq: 11
http:
  method: POST
  url: '{{userBaseUrl}}/login'
  body:
    type: json
    data: |-
      {
        "username": "auditor_{{runId}}",
        "password": "Secret12345"
      }
  auth: inherit
runtime:
  scripts:
  - type: after-response
    code: |-
      bru.setVar("auditorToken", res.body.access_token);
  assertions:
  - expression: res.status
    operator: eq
    value: '200'
